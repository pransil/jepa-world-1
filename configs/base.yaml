# Defaults from SPEC.md. Experiment configs inherit with `base: base.yaml` and override only what
# they change. Items marked [OPEN] are SPEC §9 questions: change them only after the user has
# decided, and record the decision in docs/decisions/.

seed: 0

sim:                          # SPEC §3. Design: jepa_world/sim/DESIGN.md
  generator_version: 1        # bump whenever simulator output changes for the same config
  fps: 15
  episode_frames: 60
  frame_size: 64
  substeps: 40                # physics steps per frame -> timestep 1/(fps*substeps) = 1/600 s
  gravity: 9.81
  camera_mode: track_lagged   # decided 2026-11-17 (docs/decisions/*-camera-mode-track-lagged.md): track_lagged | track_full
  camera:                     # orthographic, side-on, looking along +y (docs/decisions/*-orthographic-camera.md)
    view_height: 3.6          # metres visible vertically (and horizontally: frames are square)
    distance: 10.0            # camera sits at y = -distance (orthographic: affects clipping only)
    lerp_x: 0.25              # per-frame smoothing toward the ball's x
    lerp_z: 0.04              # per-frame smoothing toward the deadzone edge once the ball leaves it
    deadzone_z: 0.6           # ball z may sit +-deadzone_z from the camera centre before z follows
  terrain:                    # h(x): sinusoids + smoothed ledges + quadratic end walls, constant along y
    length: 40.0              # metres, centred on x = 0
    columns: 512              # heightfield samples along x
    waves: 4
    wavelength: [2.0, 20.0]   # metres, log-uniform
    spectrum: 1.0             # wave amplitude ~ wavelength**spectrum
    relief: [0.5, 4.0]        # metres, interior peak-to-peak of the waves, uniform (before the slope cap)
    max_slope: 0.8            # |dh/dx| cap outside the walls (scales the whole profile down)
    ledges: [2, 5]            # number of ledges, uniform integer (deep drops; walls the other way)
    ledge_height: [1.0, 3.0]  # metres; the sign is random (a step down or up along +x)
    ledge_width: 0.2          # metres of smoothstep transition
    ledge_gap: 1.0            # metres: min spacing between ledges, and from the wall zones
    wall_width: 2.0           # metres at each end
    wall_height: 6.0          # metres added at the outer edge (quadratic ramp)
    base: 0.5                 # heightfield slab thickness below its lowest point
  ball:                       # hidden per-episode parameters + initial state, sampled uniformly
    radius: [0.15, 0.35]      # metres
    friction: [0.1, 1.0]      # sliding mu; rolling = contact.rolling_per_friction * friction (docs/decisions/*-friction-sliding-plus-rolling.md)
    restitution: [0.2, 0.8]   # normal coefficient of restitution at contact.restitution_ref_speed
    start_x: [-8.0, 8.0]
    drop: [0.0, 2.0]          # start height of the ball's bottom above the terrain
    vx0: [-3.0, 3.0]          # initial horizontal speed; initial spin = rolling (vx0 / radius)
  contact:
    stiffness: 3.0e4          # direct-mode solref (-stiffness, -damping); damping calibrated from restitution
    solimp: [0.99, 0.99, 0.001, 0.5, 2.0]
    restitution_ref_speed: 3.0     # m/s impact speed at which restitution is calibrated
    rolling_per_friction: 0.01     # rolling-resistance coefficient (m) per unit friction
    min_air_s: 0.1            # bounce = contact onset after >= this long airborne...
    bounce_min_speed: 0.5     # ...with normal approach speed >= this (m/s)

data:                         # SPEC §3.5, split by terrain seed, never by frame
  source: episodes            # episodes (the M2 loader) | synthetic (moving disc; smoke runs and benchmarks only)
  dev_terrain_seeds: 10
  train_terrain_seeds: 500
  test_terrain_seeds: 50
  ball_samples_per_terrain: null   # "several", TBD in M2

model:                        # SPEC §4
  context_frames: 4
  levels:                     # channels @ resolution
    L1: {channels: 64, size: 64}
    L2: {channels: 128, size: 32}
    L3: {channels: 256, size: 8}
  downsample: stride2         # 3x3 stride-2 conv per 2x step (docs/decisions/2026-11-17-downsample-stride2.md)
  norm_groups: 8              # GroupNorm groups in encoder and heads: no batch statistics, no buffers
  horizons: [1, 2, 3, 4, 5, 10, 20]
  head_level: {1: L1, 2: L1, 3: L1, 4: L1, 5: L1, 10: L2, 20: L3}
  far_horizons: [10, 20]      # Gaussian mean + log-variance heads
  horizon_embed_dim: 8        # learned per-horizon vector, broadcast over positions (SPEC §4.5)
  l1_head_hidden: 32          # benchmarked on MPS (docs/decisions/2026-11-17-l1-head-width.md)
  l1_head_kernel: 3           # 3x3, not 1x1: keeps a 9x9 px receptive field at L1 (same decision)
  ema_momentum: 0.996         # [OPEN] maybe toward 0.999 later
  action_dim: 0               # slot exists, zeros in v1

loss:                         # SPEC §5
  latent_distance: mse        # squared L2, summed over channels, mean over positions (docs/decisions/2026-11-17-latent-distance-sq-l2.md)
  collapse_guard: true        # VICReg-style variance floor (docs/decisions/2026-11-17-collapse-guard-on.md)
  var_gamma: 1.0              # target batch std per (channel, position)
  var_eps: 1.0e-4             # inside the sqrt, so a zero-variance feature has a finite gradient
  w_var: 1.0
  w_k: 1.0
  w_goal: 0.5
  w_pix: 0.05

train:                        # SPEC §6
  device: auto                # auto | mps | cpu
  batch_size: 32
  optimizer: adamw
  lr: 1.0e-3                  # torch 2.15 AdamW default ("start with defaults, then tune")
  weight_decay: 0.01          # torch 2.15 AdamW default
  precision: fp32             # do not assume bf16 works on MPS
  stages: [near, far, goal, pixel]   # SPEC §5.5
  steps: 10000                # placeholder, set per experiment
  log_every: 50               # flush interval for metrics.jsonl; every step is still logged
  ckpt_every: 2000            # plus one checkpoint at the end
