# Headline run: the full model (near, far, goal, pixel) on base.yaml's defaults, train split.
# Stage starts are base.yaml's (far 2000, goal 4000, pixel 6000: goal/pixel PROPOSED in
# docs/decisions/2026-11-17-m5-stage-starts-and-aux-sizes.md). Only the length is set here:
# 24000 steps, so the full model trains for 18000 steps after pixel joins.
