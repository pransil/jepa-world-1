# M7 pixel ablation, rescaled: the headline run (24k steps, all four stages, base starts) with the
# pixel term held at 1% of the rest of loss/total once the pixel stage starts (w_pix is then ignored).
# docs/decisions/2026-11-18-pixel-ablation-target-share.md. Seeds 0 (this file) and 1 (--set seed=1).
base: exp_headline.yaml

loss:                         # what ran in PR #28: summed latents with SPEC's w_goal (base.yaml: mean, 0.5/256
  latent_reduce: sum          # since 2026-11-19, docs/decisions/2026-11-19-latent-loss-normalization.md)
  w_goal: 0.5
  pix_share: 0.01
